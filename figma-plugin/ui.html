<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --c-disconnected: #b3b3b3;
        --c-connected: #19e54c;
        --c-warning: #e5c319;
        --c-error: #e53519;
      }
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
      body { position: relative; }
      #state {
        width: 100%;
        height: 100%;
        background: var(--c-disconnected);
        transition: background 180ms ease;
      }
      /* Clickable only while there is no bridge — that is the one state where
         the plugin has something useful to offer (where to install it). When
         connected, a stray click must not navigate anything. */
      #state.actionable { cursor: pointer; }
      #state.actionable:hover { filter: brightness(1.08); }
      #state.connected { background: var(--c-connected); }
      #state.warning { background: var(--c-warning); }
      #state.error { background: var(--c-error); }
      @keyframes grip-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      #state.pulsing { animation: grip-pulse 900ms ease-in-out infinite; }
      /* Update indicator: additive, a sibling OVER the strip (so the strip's
         colour/pulse are untouched). Hidden unless the bridge announced a newer
         Grip. Two clicks: the first asks to confirm, the second installs. */
      #upd {
        display: none;
        position: absolute;
        right: 4px;
        top: 50%;
        transform: translateY(-50%);
        max-width: 112px;
        box-sizing: border-box;
        padding: 3px 7px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.62);
        color: rgba(0, 0, 0, 0.78);
        font: 600 10px/1 system-ui, -apple-system, 'Segoe UI', sans-serif;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
        user-select: none;
      }
      #upd.show { display: block; }
      #upd:hover { background: rgba(255, 255, 255, 0.85); }
      #upd.confirm { background: #fff; }
    </style>
  </head>
  <body>
    <div id="state"></div>
    <div id="upd" role="button"></div>
    <script>
      const URL = 'ws://localhost:7777';
      const el = document.getElementById('state');
      let ws = null;
      let backoff = 500;
      let reconnectTimer = null;
      let busyCount = 0;
      let errorClearTimer = null;
      let current = 'disconnected';

      function setState(name) {
        if (current === name) return;
        current = name;
        el.classList.remove('connected', 'warning', 'error');
        if (name !== 'disconnected') el.classList.add(name);
        // Grey means no bridge is listening. The plugin can't start one — the
        // Figma sandbox has no way to launch a local process — so offer the
        // install instructions instead of just sitting there grey.
        const needsSetup = name === 'disconnected' || name === 'error';
        el.classList.toggle('actionable', needsSetup);
        el.title = needsSetup
          ? 'Grip bridge not running — click for setup instructions'
          : '';
        applyPulse();
      }

      function applyPulse() {
        if (current === 'connected' && busyCount > 0) {
          el.classList.add('pulsing');
        } else {
          el.classList.remove('pulsing');
        }
      }

      function flashError() {
        setState('error');
        if (errorClearTimer) clearTimeout(errorClearTimer);
        errorClearTimer = setTimeout(() => {
          errorClearTimer = null;
          if (ws && ws.readyState === 1) setState('connected');
        }, 2000);
      }

      function connect() {
        if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
        try {
          ws = new WebSocket(URL);
        } catch (e) {
          setState('error');
          scheduleReconnect();
          return;
        }
        ws.onopen = () => {
          setState('connected');
          backoff = 500;
          // Back after an update-triggered restart: the new bridge re-announces
          // an update itself if one is still pending.
          if (updPhase === 'updating') { updLatest = null; updPhase = 'idle'; renderUpd(); }
        };
        ws.onclose = (ev) => {
          if (ev.code === 1000 && ev.reason === 'duplicate') {
            setState('warning');
            backoff = 10000;
          } else {
            setState('disconnected');
          }
          busyCount = 0;
          applyPulse();
          // Not connected: nothing to click. (Mid-update the drop is expected —
          // the bridge restarts — so keep "updating…" until we reconnect.)
          if (updPhase !== 'updating') { updLatest = null; updPhase = 'idle'; renderUpd(); }
          scheduleReconnect();
        };
        ws.onerror = () => setState('error');
        ws.onmessage = (ev) => {
          let msg;
          try { msg = JSON.parse(ev.data); } catch { return; }
          // Bridge → UI control (welcome) is forwarded to plugin so it can hello back.
          if (msg && msg.kind === 'welcome') {
            parent.postMessage({ pluginMessage: { kind: 'welcome', sessionId: msg.sessionId } }, '*');
            return;
          }
          // Update notices (additive; older plugins/bridges simply ignore them).
          if (msg && msg.type === 'update') { onUpdateNotice(msg); return; }
          if (msg && msg.type === 'update_result') { onUpdateResult(msg); return; }
          if (msg && msg.id && msg.method) {
            parent.postMessage(
              { pluginMessage: { kind: 'request', id: msg.id, method: msg.method, params: msg.params || {} } },
              '*'
            );
          }
        };
      }

      // ---- update indicator ----
      const updEl = document.getElementById('upd');
      let updLatest = null;       // newest version the bridge announced (null = none)
      let updHeadline = '';       // one-line release summary the bridge sent along (may be empty)
      let updClone = false;       // the bridge said: developer (clone) install, update with the clone
      let updPhase = 'idle';      // idle | confirm | updating | failed
      let updTimer = null;

      function setUpdTimer(fn, ms) {
        if (updTimer) clearTimeout(updTimer);
        updTimer = setTimeout(() => { updTimer = null; fn(); }, ms);
      }

      function renderUpd() {
        const visible = updPhase !== 'idle' || !!updLatest;
        updEl.classList.toggle('show', visible);
        updEl.classList.toggle('confirm', updPhase === 'confirm');
        if (!visible) return;
        updEl.textContent =
          updPhase === 'confirm' ? 'click to confirm' :
          updPhase === 'updating' ? 'updating\u2026' :
          updPhase === 'failed' ? (updClone ? 'use the clone' : 'update failed') : '\u2191 update';
        updEl.title =
          updPhase === 'confirm' ? 'Click again within 5s to download and install Grip ' + (updLatest || '') :
          updPhase === 'updating' ? 'Installing, the bridge will restart in a moment' :
          updPhase === 'failed' ? (updClone
            ? 'This Grip runs from a git clone (a developer install), so it is not updated in place. In the clone, run: git pull && node bridge/install.mjs'
            : 'The update did not install; ask your agent for details (grip_update) or run: node ~/.grip/grip-bridge.mjs update') :
          'Grip ' + (updLatest || 'update') + ' is available' + (updHeadline ? ': ' + updHeadline : '.') + ' Click, then confirm, to install it.';
      }

      function onUpdateNotice(msg) {
        if (updPhase === 'updating') return;
        updLatest = msg.available ? (msg.latest || 'new') : null;
        updHeadline = msg.available && typeof msg.headline === 'string' ? msg.headline : '';
        if (!updLatest) updPhase = 'idle';
        renderUpd();
      }

      function onUpdateResult(msg) {
        if (msg.status === 'updated') {
          if (msg.restart === 'scheduled') return;   // bridge is about to restart; reconnect clears us
          updPhase = 'idle'; updLatest = null;       // installed, but no automatic restart
        } else if (msg.status === 'already_installing') {
          return;
        } else if (msg.status === 'up_to_date') {
          updPhase = 'idle'; updLatest = null;
        } else {
          updClone = msg.status === 'clone_install';
          updPhase = 'failed';
          setUpdTimer(() => { updPhase = 'idle'; renderUpd(); }, 5000);
        }
        renderUpd();
      }

      // The user's trigger. Iframes can't rely on window.confirm, so: first click
      // flips the label to "click to confirm" for 5s; a second click installs.
      updEl.addEventListener('click', (e) => {
        e.stopPropagation();
        if (updPhase === 'idle' && updLatest) {
          updPhase = 'confirm';
          setUpdTimer(() => { if (updPhase === 'confirm') { updPhase = 'idle'; renderUpd(); } }, 5000);
          renderUpd();
        } else if (updPhase === 'confirm') {
          updPhase = 'updating';
          send({ type: 'update_request' });
          // If no restart/reconnect follows, don't sit on "updating…" forever.
          setUpdTimer(() => { if (updPhase === 'updating') { updPhase = 'idle'; renderUpd(); } }, 60000);
          renderUpd();
        }
      });

      function scheduleReconnect() {
        if (reconnectTimer !== null) return;
        const MAX_BACKOFF = 2000;
        const delay = Math.min(backoff, MAX_BACKOFF);
        backoff = Math.min(backoff * 2, MAX_BACKOFF);
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          connect();
        }, delay);
      }

      function send(obj) {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
      }

      window.onmessage = (ev) => {
        const msg = ev.data && ev.data.pluginMessage;
        if (!msg) return;

        if (msg.kind === 'response') {
          send({ id: msg.id, result: msg.result, error: msg.error });
        } else if (msg.kind === 'scriptLog') {
          // Relay a streamed run_script log line so the bridge can attach it
          // to a timeout error (partial-mutation forensics).
          send({ scriptLog: true, id: msg.id, line: msg.line });
        } else if (msg.kind === 'event') {
          send({ event: msg.event, data: msg.data });
        } else if (msg.kind === 'hello') {
          // Forward every field the plugin set (including `version` and
          // any future additions). An earlier allow-list dropped fields
          // silently and led to a long false-positive Figma-cache hunt.
          const { pluginMessage: _drop, ...rest } = msg;
          send({ ...rest, kind: 'hello' });
        } else if (msg.kind === 'busy') {
          if (msg.busy) busyCount++;
          else busyCount = Math.max(0, busyCount - 1);
          applyPulse();
        } else if (msg.kind === 'error') {
          flashError();
        }
      };

      el.addEventListener('click', () => {
        if (!el.classList.contains('actionable')) return;
        parent.postMessage({ pluginMessage: { kind: 'openSetup' } }, '*');
      });

      // Initialise title/cursor for the starting (disconnected) state, which
      // setState() skips because `current` already equals 'disconnected'.
      el.classList.add('actionable');
      el.title = 'Grip bridge not running — click for setup instructions';

      connect();
    </script>
  </body>
</html>
