<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --c-disconnected: #b3b3b3;
        --c-connected: #19e54c;
        --c-warning: #e5c319;
        --c-error: #e53519;
        /* Update available: the ONE colour used by no other state (grey / green /
           yellow / red are taken), a clear violet that stays distinct from all
           four on both light and dark canvases. */
        --c-update: #a855f7;
      }
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
      #state {
        width: 100%;
        height: 100%;
        background: var(--c-disconnected);
        transition: background 180ms ease;
      }
      /* Clickable while there is no bridge (where to install it) ... */
      #state.actionable { cursor: pointer; }
      #state.actionable:hover { filter: brightness(1.08); }
      #state.connected { background: var(--c-connected); }
      #state.warning { background: var(--c-warning); }
      #state.error { background: var(--c-error); }
      @keyframes grip-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      #state.pulsing { animation: grip-pulse 900ms ease-in-out infinite; }
      /* ... and while a compatible update is waiting: purple, pulsing slowly.
         One click installs it. Defined after .connected/.pulsing so it wins. */
      @keyframes grip-update-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      #state.update { background: var(--c-update); animation: grip-update-pulse 1600ms ease-in-out infinite; }
      #state.update.clickable { cursor: pointer; }
      #state.update.clickable:hover { filter: brightness(1.1); }
      /* Installing: still purple, but a faster, shallower pulse (work in progress). */
      @keyframes grip-updating-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.72; }
      }
      #state.updating { background: var(--c-update); animation: grip-updating-pulse 450ms ease-in-out infinite; cursor: progress; }
    </style>
  </head>
  <body>
    <div id="state"></div>
    <script>
      const URL = 'ws://localhost:__WS_PORT__';
      // Build flavour of this plugin (the bridge refuses another flavour with close 4409).
      const FLAVOUR = '__FLAVOUR__';
      // Label that starts every pairing proof; same rule as authLabel in the bridge's
      // pairing.ts. The public flavour keeps the legacy label.
      function authLabel(slug) { return slug === 'grip' ? 'grip-auth' : 'grip-auth:' + slug; }
      const AUTH_LABEL = authLabel(FLAVOUR);
      // Frames that ask the bridge to let us in (pair_request, auth, hello) name the flavour.
      // The public build sends them exactly as before: no flavour means 'grip' to the bridge.
      function withFlavour(frame) { return FLAVOUR === 'grip' ? frame : Object.assign({}, frame, { flavour: FLAVOUR }); }
      const el = document.getElementById('state');
      let ws = null;
      let backoff = 500;
      let reconnectTimer = null;
      let busyCount = 0;
      let errorClearTimer = null;
      let current = 'disconnected';
      let pluginVersion = '';     // from the plugin's own hello (for the tooltip)
      let bridgeVersion = '';     // from the bridge's welcome
      let minBridge = '';         // from the plugin's own hello: the oldest bridge it wants
      let bridgeProtocol = null;  // from the bridge's welcome (null = a bridge that predates the integer)
      let minBridgeProtocol = null;   // from the plugin's own hello: the oldest bridge protocol it wants

      // Update state. There is no label and no pill: just the purple colour, a
      // tooltip, and one click.
      let updLatest = null;       // version the bridge offered (null = nothing to offer)
      let updCurrent = '';        // the bridge's own version, from the same frame
      let updHeadline = '';       // one-line release summary (may be empty)
      let updPhase = 'idle';      // idle | updating | failed
      let updClone = false;       // the bridge said: developer (git clone) install, never updated in place
      let updError = '';          // short reason of the last failure
      let updFlash = false;       // the red flash on screen is an update failure, not "no bridge"
      let updTimer = null;

      // ---- Pairing (bridge/src/pairing.ts) ------------------------------------------------
      // The socket is untrusted until the bridge proves it holds the shared secret we keep in
      // clientStorage (via code.ts). Until then we neither say hello (no file name, no key) nor
      // obey a request. A bridge that predates pairing sends no nonce; with no token stored we
      // go on as before, but once a token exists a bridge without a nonce is refused (that is
      // what an impostor squatting the port looks like).
      let trusted = false;          // may this socket's requests be obeyed?
      let pairIssue = '';           // '' | 'needs' | 'raced' | 'lost' | 'unverified' | 'flavour'
      let welcomeMsg = null;        // the welcome frame we are answering
      let nonceBridge = '', noncePlugin = '';
      let storedToken = null;       // {id, secret} | null
      let tokenLoaded = false;
      let tokenWaiters = [];
      let pairDeniedRetried = false;
      let bridgeFlavour = '';       // the other build's flavour, while pairIssue is 'flavour'
      // Admission ticket: a paired plugin puts the id of its token (never the secret) in the connect
      // URL so the bridge queues it in a reserved pool that socket churn from a web page cannot
      // exhaust. If Figma were to refuse a URL with a query, every third attempt goes without it
      // and, once that works, the ticket is dropped for the rest of this window.
      let ticketFails = 0, ticketOk = true, usedTicket = false;

      // Plain-JS SHA-256 / HMAC-SHA-256 (no dependency on crypto.subtle, which a sandboxed
      // iframe may not offer). Checked against node:crypto in test/plugin-ui.mjs.
      const SHA_K = [], SHA_H0 = [];
      (function () {
        let found = 0;
        for (let n = 2; found < 64; n++) {
          let prime = true;
          for (let d = 2; d * d <= n; d++) if (n % d === 0) { prime = false; break; }
          if (!prime) continue;
          if (found < 8) SHA_H0.push((Math.sqrt(n) % 1) * 4294967296 | 0);
          SHA_K.push((Math.cbrt(n) % 1) * 4294967296 | 0);
          found++;
        }
      })();
      function sha256(bytes) {
        const l = bytes.length, words = [];
        for (let i = 0; i < l; i++) words[i >> 2] |= bytes[i] << (24 - (i % 4) * 8);
        words[l >> 2] |= 0x80 << (24 - (l % 4) * 8);
        words[(((l + 8) >> 6) << 4) + 15] = l * 8;
        const H = SHA_H0.slice(), w = new Array(64);
        for (let o = 0; o < words.length; o += 16) {
          for (let i = 0; i < 64; i++) {
            if (i < 16) { w[i] = words[o + i] | 0; continue; }
            const x = w[i - 15], y = w[i - 2];
            const s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
            const s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
            w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
          }
          let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
          for (let i = 0; i < 64; i++) {
            const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
            const t1 = (h + S1 + ((e & f) ^ (~e & g)) + SHA_K[i] + w[i]) | 0;
            const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
            const t2 = (S0 + ((a & b) ^ (a & c) ^ (b & c))) | 0;
            h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
          }
          H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
          H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
        }
        const out = new Uint8Array(32);
        for (let i = 0; i < 8; i++) { out[i * 4] = H[i] >>> 24; out[i * 4 + 1] = (H[i] >>> 16) & 255; out[i * 4 + 2] = (H[i] >>> 8) & 255; out[i * 4 + 3] = H[i] & 255; }
        return out;
      }
      function utf8(str) { return new TextEncoder().encode(str); }
      function hmacHex(keyStr, msgStr) {
        let key = utf8(keyStr);
        if (key.length > 64) key = sha256(key);
        const ipad = new Uint8Array(64), opad = new Uint8Array(64);
        for (let i = 0; i < 64; i++) { const k = i < key.length ? key[i] : 0; ipad[i] = k ^ 0x36; opad[i] = k ^ 0x5c; }
        const m = utf8(msgStr);
        const inner = new Uint8Array(64 + m.length); inner.set(ipad); inner.set(m, 64);
        const ih = sha256(inner);
        const outer = new Uint8Array(96); outer.set(opad); outer.set(ih, 64);
        return Array.from(sha256(outer)).map((x) => (x < 16 ? '0' : '') + x.toString(16)).join('');
      }
      function randomHex(n) {
        const b = new Uint8Array(n);
        (globalThis.crypto || window.crypto).getRandomValues(b);
        return Array.from(b).map((x) => (x < 16 ? '0' : '') + x.toString(16)).join('');
      }
      function sameString(a, b) {
        if (typeof a !== 'string' || typeof b !== 'string' || a.length !== b.length) return false;
        let r = 0; for (let i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i);
        return r === 0;
      }
      function withToken(cb) { if (tokenLoaded) cb(storedToken); else tokenWaiters.push(cb); }
      function toCode(m) { parent.postMessage({ pluginMessage: m }, '*'); }
      function sayHello() { if (welcomeMsg) toCode({ kind: 'welcome', sessionId: welcomeMsg.sessionId }); }
      function beginPairing() {
        withToken((tok) => {
          if (!welcomeMsg || !ws || ws.readyState !== 1) return;
          if (tok) {
            noncePlugin = randomHex(16);
            send(withFlavour({ type: 'auth', tokenId: tok.id, nonce: noncePlugin, proof: hmacHex(tok.secret, AUTH_LABEL + '|plugin|' + nonceBridge + '|' + noncePlugin) }));
          } else {
            send(withFlavour({ type: 'pair_request' }));
          }
        });
      }
      // Give up on this socket for a reason the user can act on; retry slowly.
      function refuseBridge(issue) {
        pairIssue = issue; trusted = false;
        backoff = 8000;
        try { if (ws) ws.close(1000, 'pairing'); } catch (e) {}
        setState('warning');
      }
      function onPairFrame(msg) {
        if (msg.type === 'auth_ok') {
          const tok = storedToken;
          if (!tok || !welcomeMsg) return;
          if (!sameString(msg.proof, hmacHex(tok.secret, AUTH_LABEL + '|bridge|' + nonceBridge + '|' + noncePlugin))) { refuseBridge('unverified'); return; }
          trusted = true; pairIssue = ''; sayHello(); render();
        } else if (msg.type === 'auth_failed') {
          refuseBridge('lost');
        } else if (msg.type === 'paired') {
          if (typeof msg.tokenId !== 'string' || typeof msg.secret !== 'string' || msg.secret.length < 32) return;
          storedToken = { id: msg.tokenId, secret: msg.secret }; tokenLoaded = true;
          toCode({ kind: 'pairSet', token: storedToken });
          trusted = true; pairIssue = ''; sayHello(); render();
        } else if (msg.type === 'pair_denied') {
          // Another window of this plugin may have paired a moment ago and saved its token: look once more.
          if (!pairDeniedRetried) {
            pairDeniedRetried = true; tokenLoaded = false;
            toCode({ kind: 'pairGet' });
            withToken((tok) => { if (tok) beginPairing(); else refuseBridge(msg.recentGrant ? 'raced' : 'needs'); });
          } else refuseBridge(msg.recentGrant ? 'raced' : 'needs');
        }
      }

      // x.y.z compare; anything unparseable counts as 'not older' (never nag on a guess).
      function olderThan(a, b) {
        const pa = /^(\d+)\.(\d+)\.(\d+)/.exec(a), pb = /^(\d+)\.(\d+)\.(\d+)/.exec(b);
        if (!pa || !pb) return false;
        for (let i = 1; i <= 3; i++) { if (+pa[i] !== +pb[i]) return +pa[i] < +pb[i]; }
        return false;
      }
      // The bridge is older than this plugin wants and has not offered an in-place
      // update. Purple too. A bridge from 0.8.0 on hears update requests, so the click
      // asks it for the latest release; only an older bridge cannot, and then the click
      // opens the install page.
      const UPDATER_SINCE = '0.8.0';
      function bridgeOutdated() {
        if (current !== 'connected' || updLatest || updClone || updPhase === 'updating') return false;
        if (!!bridgeVersion && !!minBridge && olderThan(bridgeVersion, minBridge)) return true;
        // the protocol integer, only when both sides say one
        return typeof bridgeProtocol === 'number' && typeof minBridgeProtocol === 'number' && bridgeProtocol < minBridgeProtocol;
      }
      function bridgeHearsUpdates() {
        return !!bridgeVersion && !olderThan(bridgeVersion, UPDATER_SINCE);
      }

      // Colour + tooltip + cursor are all derived from the state above, in one place.
      function render() {
        el.classList.remove('connected', 'warning', 'error', 'update', 'updating', 'clickable', 'actionable', 'pulsing');
        if (current !== 'disconnected') el.classList.add(current);
        if (pairIssue) el.classList.add('actionable');
        // Purple only while connected: a disconnected strip stays grey.
        const offered = current === 'connected' && !!updLatest && !updClone;
        // Grey means no bridge is listening. The plugin can't start one (the Figma
        // sandbox cannot launch a local process), so offer the install pointer.
        const needsSetup = (current === 'disconnected' || current === 'error') && !updFlash && updPhase !== 'updating';
        if (offered) {
          el.classList.add(updPhase === 'updating' ? 'updating' : 'update');
          if (updPhase !== 'updating') el.classList.add('clickable');
        } else if (bridgeOutdated()) {
          el.classList.add('update', bridgeHearsUpdates() ? 'clickable' : 'actionable');
        } else if (needsSetup) {
          el.classList.add('actionable');
        } else if (current === 'connected' && busyCount > 0) {
          el.classList.add('pulsing');
        }
        el.title = tooltip(offered, needsSetup);
      }

      // Tooltips are native `title`s: keep every one very short and plain.
      function tooltip(offered, needsSetup) {
        if (updPhase === 'updating') return current === 'connected' ? 'Updating…' : 'Restarting…';
        if (pairIssue === 'flavour') return 'Wrong Grip build: this plugin is ' + FLAVOUR + ', the bridge is ' + bridgeFlavour;
        if (pairIssue === 'raced') return 'Another client paired first. If that was not you, run "node ~/.grip/grip-bridge.mjs pair --reset", then "pair"';
        if (pairIssue === 'needs') return 'Not paired. Run "node ~/.grip/grip-bridge.mjs pair", then click here';
        if (pairIssue === 'lost') return 'Pairing lost. Click to pair again';
        if (pairIssue === 'unverified') return 'This bridge could not prove who it is. Click to forget the pairing';
        if (needsSetup) return 'Bridge not running. Click for setup';
        if (current !== 'connected') return '';
        if (updLatest && updClone) return 'Update available (developer install)';
        if (bridgeOutdated()) return bridgeHearsUpdates() ? 'Bridge update needed. Click to update' : 'Bridge update needed. Click for steps';
        if (offered && updPhase === 'failed') return 'Update failed. Click to retry';
        if (offered) return 'Update available. Click to install';
        return 'Connected';
      }

      function setState(name) {
        current = name;
        render();
      }

      function flashError(fromUpdate) {
        updFlash = !!fromUpdate;
        setState('error');
        if (errorClearTimer) clearTimeout(errorClearTimer);
        errorClearTimer = setTimeout(() => {
          errorClearTimer = null;
          updFlash = false;
          if (ws && ws.readyState === 1) setState('connected'); else render();
        }, 2000);
      }

      function setUpdTimer(fn, ms) {
        if (updTimer) clearTimeout(updTimer);
        updTimer = fn ? setTimeout(() => { updTimer = null; fn(); }, ms) : null;
      }

      function clearUpdate() {
        setUpdTimer(null);
        updLatest = null; updCurrent = ''; updHeadline = '';
        updPhase = 'idle'; updClone = false; updError = '';
      }

      function connect() {
        if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
        try {
          const ticket = storedToken && ticketOk && ticketFails < 2 && /^[0-9a-f]{16}$/.test(storedToken.id);
          usedTicket = !!ticket;
          ws = new WebSocket(ticket ? URL + '/?t=' + storedToken.id : URL);
        } catch (e) {
          setState('error');
          scheduleReconnect();
          return;
        }
        let everOpened = false;
        ws.onopen = () => {
          everOpened = true;
          if (usedTicket) ticketFails = 0;
          else if (storedToken && ticketFails >= 2) { ticketOk = false; }   // it works without the query, not with it
          backoff = 500;
          trusted = false; welcomeMsg = null; pairDeniedRetried = false;
          // Always re-read: another window of this plugin may have paired (and saved the token) since
          // we last looked; a stale empty copy would keep asking to pair and be refused forever.
          tokenLoaded = false;
          toCode({ kind: 'pairGet' });
          // Back after an update-triggered restart: whatever was pending belongs
          // to the OLD bridge. The new one re-announces an update itself if one
          // is still pending.
          if (updPhase === 'updating') clearUpdate();
          setState('connected');
        };
        ws.onclose = (ev) => {
          busyCount = 0;
          if (!everOpened) { if (usedTicket) ticketFails++; else if (ticketFails >= 2) ticketFails = 0; }
          // Mid-update the drop is expected (the bridge restarts): keep "Updating…"
          // until we reconnect. Otherwise nothing is on offer without a bridge.
          if (updPhase !== 'updating') clearUpdate();
          trusted = false;
          if (ev.code === 1000 && ev.reason === 'duplicate') {
            setState('warning');
            backoff = 10000;
          } else if (pairIssue) {
            setState('warning');
          } else {
            setState('disconnected');
          }
          scheduleReconnect();
        };
        // (While the bridge restarts for an update every failed reconnect fires onerror:
        // that must stay grey, not flicker red.)
        ws.onerror = () => { if (updPhase !== 'updating') setState('error'); };
        ws.onmessage = (ev) => {
          let msg;
          try { msg = JSON.parse(ev.data); } catch { return; }
          // Bridge → UI control (welcome) is forwarded to plugin so it can hello back.
          if (msg && msg.kind === 'welcome') {
            // A bridge of another build (absent = the public 'grip'): never say hello to it.
            const theirs = msg.flavour === undefined ? 'grip' : typeof msg.flavour === 'string' ? msg.flavour.replace(/[^\x20-\x7e]/g, '').slice(0, 40) : '?';
            if (theirs !== FLAVOUR) { bridgeFlavour = theirs || '?'; refuseBridge('flavour'); return; }
            if (pairIssue === 'flavour') { pairIssue = ''; bridgeFlavour = ''; }
            if (typeof msg.bridgeVersion === 'string') bridgeVersion = msg.bridgeVersion;
            bridgeProtocol = typeof msg.protocol === 'number' ? msg.protocol : null;
            welcomeMsg = msg;
            render();
            if (typeof msg.nonce === 'string' && msg.nonce.length >= 16) {
              nonceBridge = msg.nonce;
              beginPairing();
            } else {
              // A bridge without pairing. Fine for a plugin that never paired; once it has a
              // token, a bridge that cannot take part is not the one it paired with.
              withToken((tok) => { if (tok) refuseBridge('unverified'); else { trusted = true; sayHello(); } });
            }
            return;
          }
          // Pairing answers come first and never need trust.
          if (msg && (msg.type === 'auth_ok' || msg.type === 'auth_failed' || msg.type === 'paired' || msg.type === 'pair_denied')) { onPairFrame(msg); return; }
          // Everything else is the bridge talking: nothing from a socket that has not proven itself.
          if (!trusted) return;
          // Update frames (additive; older plugins/bridges simply ignore them).
          if (msg && msg.type === 'update') { onUpdateNotice(msg); return; }
          if (msg && msg.type === 'update_result') { onUpdateResult(msg); return; }
          if (msg && msg.id && msg.method) {
            // Forward the whole frame (timeoutMs and any later additive field),
            // not an allow-list: dropping fields here once hid the bridge's
            // budget from the plugin.
            parent.postMessage(
              { pluginMessage: Object.assign({}, msg, { kind: 'request', params: msg.params || {} }) },
              '*'
            );
          }
        };
      }

      // {type:'update', available, latest, current, headline}: `available` is the
      // bridge's SIGNAL (an update exists AND every connected plugin is compatible).
      function onUpdateNotice(msg) {
        if (updPhase === 'updating') return;
        const was = updLatest;
        updLatest = msg.available ? (typeof msg.latest === 'string' && msg.latest ? msg.latest : 'new') : null;
        updCurrent = typeof msg.current === 'string' ? msg.current : '';
        updHeadline = msg.available && typeof msg.headline === 'string' ? msg.headline : '';
        // A different offer (or none) wipes the verdict about the old one.
        if (!updLatest || updLatest !== was) { updClone = false; updError = ''; if (updPhase === 'failed') updPhase = 'idle'; }
        render();
      }

      // {type:'update_result', status, ...}: the outcome of OUR click.
      function onUpdateResult(msg) {
        setUpdTimer(null);
        if (msg.status === 'updated') {
          // restart 'scheduled': the bridge is about to restart; the reconnect clears us.
          if (msg.restart === 'scheduled') { render(); return; }
          // Installed, but no automatic restart: nothing left to click.
          clearUpdate();
          render();
        } else if (msg.status === 'already_installing') {
          render();
        } else if (msg.status === 'up_to_date') {
          clearUpdate();
          render();
        } else if (msg.status === 'clone_install') {
          // Developer install: never updated in place. Stop being purple.
          updPhase = 'idle'; updClone = true;
          render();
        } else if (msg.code === 'version_changed') {
          // A newer release appeared since the user looked: not a failure. The
          // fresh `update` frame follows and re-arms the indicator for it.
          updPhase = 'idle';
          render();
        } else {
          updPhase = 'failed';
          updError = shortReason(msg.message);
          flashError(true);   // brief red flash, then back to purple (render() in the flash timer)
        }
      }

      function shortReason(m) {
        const t = String(m || 'unknown error').replace(/\s+/g, ' ').trim();
        return t.length > 140 ? t.slice(0, 139) + '…' : t;
      }

      // The user's click on the purple strip: ask the bridge to install the
      // version that is being shown (it refuses if a newer one has appeared).
      // With nothing offered (the bridge is just too old for this plugin) the plugin has not
      // been shown a version: it asks for 'latest', and the bridge looks the release up itself.
      function startUpdate() {
        if (updPhase === 'updating') return;
        if (!updLatest) {
          if (!bridgeOutdated() || !bridgeHearsUpdates()) return;
          updLatest = 'latest';
        }
        updPhase = 'updating';
        updError = '';
        send({ type: 'update_request', version: updLatest });
        // No result and no restart within a minute: don't sit on "Updating…" forever.
        setUpdTimer(() => {
          if (updPhase !== 'updating') return;
          if (ws && ws.readyState === 1) { updPhase = 'failed'; updError = 'no answer from the bridge'; render(); }
          else { clearUpdate(); render(); }
        }, 60000);
        render();
      }

      function scheduleReconnect() {
        if (reconnectTimer !== null) return;
        const MAX_BACKOFF = 2000;
        // The bridge is restarting for an update: poll fast, it is back within ~2s.
        const fast = updPhase === 'updating';
        const delay = fast ? 250 : pairIssue ? 8000 : Math.min(backoff, MAX_BACKOFF);
        if (!fast) backoff = Math.min(backoff * 2, MAX_BACKOFF);
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          connect();
        }, delay);
      }

      function send(obj) {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj));
      }

      window.onmessage = (ev) => {
        const msg = ev.data && ev.data.pluginMessage;
        if (!msg) return;

        if (msg.kind === 'pairToken') {
          const t = msg.token;
          storedToken = t && typeof t.id === 'string' && typeof t.secret === 'string' ? { id: t.id, secret: t.secret } : null;
          tokenLoaded = true;
          const w = tokenWaiters; tokenWaiters = [];
          for (const cb of w) cb(storedToken);
        } else if (msg.kind === 'response') {
          send({ id: msg.id, result: msg.result, error: msg.error });
        } else if (msg.kind === 'scriptLog') {
          // Relay a streamed run_script log line so the bridge can attach it
          // to a timeout error (partial-mutation forensics).
          send({ scriptLog: true, id: msg.id, line: msg.line });
        } else if (msg.kind === 'event') {
          send({ event: msg.event, data: msg.data });
        } else if (msg.kind === 'hello') {
          // Forward every field the plugin set (including `version`, `minBridge`
          // and any future additions). An earlier allow-list dropped fields
          // silently and led to a long false-positive Figma-cache hunt. The flavour is
          // this page's (withFlavour): it is the one the pairing proof was made with.
          const { pluginMessage: _drop, ...rest } = msg;
          if (typeof msg.version === 'string') pluginVersion = msg.version;
          if (typeof msg.minBridge === 'string') minBridge = msg.minBridge;
          minBridgeProtocol = typeof msg.minBridgeProtocol === 'number' ? msg.minBridgeProtocol : null;
          render();
          send(withFlavour({ ...rest, kind: 'hello' }));
        } else if (msg.kind === 'busy') {
          if (msg.busy) busyCount++;
          else busyCount = Math.max(0, busyCount - 1);
          render();
        } else if (msg.kind === 'error') {
          flashError(false);
        }
      };

      el.addEventListener('click', () => {
        if (pairIssue) {
          // 'lost' / 'unverified': forget the old pairing so this plugin can pair again (the
          // bridge decides whether it may: first use or an open window). 'needs': just retry.
          if (pairIssue !== 'needs' && pairIssue !== 'raced' && pairIssue !== 'flavour') { storedToken = null; tokenLoaded = true; toCode({ kind: 'pairClear' }); }
          pairIssue = ''; backoff = 500; render();
          if (reconnectTimer !== null) { clearTimeout(reconnectTimer); reconnectTimer = null; }
          connect();
          return;
        }
        if (el.classList.contains('actionable')) {
          parent.postMessage({ pluginMessage: { kind: 'openSetup' } }, '*');
        } else if (el.classList.contains('clickable')) {
          startUpdate();
        }
      });

      // Starting state: disconnected, grey, with the setup tooltip.
      render();
      // The first connect waits (briefly) for the stored token so it can carry its id.
      toCode({ kind: 'pairGet' });
      setTimeout(() => { if (!tokenLoaded) { tokenLoaded = true; storedToken = null; const w = tokenWaiters; tokenWaiters = []; for (const cb of w) cb(null); } }, 1500);
      withToken(() => connect());
    </script>
  </body>
</html>
