name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm run setup

      - name: Build
        run: npm run build

      # The subset that must hold on every OS, Windows included.
      - name: Windows-safe bridge tests
        run: npm --prefix src/bridge run test:win

      - name: Identity and flavour tests
        run: |
          node src/bridge/test/identity.mjs
          node src/bridge/test/flavour.mjs
          node src/bridge/test/flavour-handshake.mjs

      - name: Full test suite
        if: runner.os != 'Windows'
        run: npm test
